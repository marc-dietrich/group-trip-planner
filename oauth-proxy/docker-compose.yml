services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: gtp-oauth2-proxy
    restart: unless-stopped
    ports:
      - "4180:4180"
    command:
      - "--http-address=0.0.0.0:4180"
      - "--provider=google"
      - "--email-domain=*"
      - "--client-id=${OAUTH_CLIENT_ID:-dummy-client-id}"
      - "--client-secret=${OAUTH_CLIENT_SECRET:-dummy-client-secret}"
      - "--cookie-secret=${OAUTH_COOKIE_SECRET:-WHRG6mAOaPLSXnEKCneZmi_eho8l0L3Q4Wvn6Alo-LY=}"
      - "--cookie-secure=false"
      - "--upstream=${OAUTH_UPSTREAM:-http://backend:8000}"
      - "--redirect-url=${OAUTH_REDIRECT_URL:-http://localhost:4180/oauth2/callback}"
      - "--skip-provider-button=true"
      - "--set-authorization-header=true"
      - "--pass-authorization-header=true"
      - "--pass-access-token=true"
      - "--request-logging=true"
      - "--standard-logging=true"
      - "--auth-logging=true"
    # For local dev, trust default self-signed; adjust as needed
    # volumes:
    #   - ./certs:/etc/ssl/certs:ro
