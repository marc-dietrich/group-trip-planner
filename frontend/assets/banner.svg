<svg width="100%" height="100%" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Base background gradient (original warm green tone) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7e3b5"/>
      <stop offset="100%" stop-color="#b9d48a"/>
    </linearGradient>

    <!-- Soft organic gradients -->
    <radialGradient id="soft1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="soft2">
      <stop offset="0%" stop-color="#cfe8a9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#cfe8a9" stop-opacity="0"/>
    </radialGradient>

    <!-- Hard line gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9c97a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7fa653" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Blur for soft depth -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Soft gradient fields -->
  <g filter="url(#blur)">
    <ellipse cx="250" cy="150" rx="400" ry="220" fill="url(#soft1)" />
    <ellipse cx="950" cy="550" rx="450" ry="260" fill="url(#soft2)" />
    <ellipse cx="700" cy="200" rx="300" ry="180" fill="url(#soft1)" />
  </g>

  <!-- Hard geometric overlays -->
  <polygon points="0,675 400,675 200,350" fill="#ffffff" fill-opacity="0.15"/>
  <polygon points="1200,0 900,0 1200,350" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Crossing structural lines -->
  <g stroke="url(#lineGrad)" stroke-width="3">
    <line x1="0" y1="120" x2="1200" y2="40"/>
    <line x1="0" y1="420" x2="1200" y2="520"/>
    <line x1="350" y1="0" x2="600" y2="675"/>
    <line x1="850" y1="0" x2="1050" y2="675"/>
  </g>

</svg>