<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "sage-50": "#f4f7f4",
                        "sage-100": "#e3e9e2",
                        "sage-200": "#c7d3c5",
                        "sage-300": "#a9b9a6",
                        "sage-400": "#899d86",
                        "sage-500": "#6a8167",
                        "sage-600": "#536651",
                        "sage-700": "#415040",
                        "sage-800": "#313c30",
                        "sage-900": "#232b22",
                        "background-light": "#f6f8f6",
                        "background-dark": "#121812",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --sage-primary: #6a8167;
            --sage-soft: #f4f7f4;
            --sage-dark: #313c30;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .blur-bg {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input:checked + .toggle-dot {
            transform: translateX(20px);
        }
        input:checked ~ .toggle-bg {
            background-color: #6a8167;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-sage-900 dark:text-sage-50">
<div class="fixed inset-0 z-0 flex flex-col p-4 opacity-30 blur-sm pointer-events-none">
<div class="flex items-center justify-between mb-8">
<div class="h-10 w-10 rounded-full bg-sage-200"></div>
<div class="h-6 w-32 bg-sage-200 rounded-lg"></div>
<div class="h-10 w-10 rounded-full bg-sage-200"></div>
</div>
<div class="space-y-4">
<div class="h-32 w-full bg-sage-100 rounded-xl"></div>
<div class="h-32 w-full bg-sage-100 rounded-xl"></div>
<div class="h-32 w-full bg-sage-100 rounded-xl"></div>
</div>
</div>
<div class="fixed inset-0 z-10 bg-black/5 dark:bg-black/40 blur-bg"></div>
<div class="fixed inset-x-0 bottom-0 z-20 flex flex-col items-center justify-center h-full p-4">
<div class="w-full max-w-sm bg-white dark:bg-[#1c231b] rounded-[2.5rem] shadow-[0_32px_64px_-12px_rgba(0,0,0,0.15)] overflow-hidden flex flex-col border border-white/20">
<div class="flex items-center justify-between p-6 pb-2">
<div class="px-4 py-1.5 bg-sage-100 dark:bg-sage-800/50 border border-sage-200 dark:border-sage-700/50 rounded-full">
<span class="text-sage-700 dark:text-sage-200 text-xs font-bold tracking-tight">3/3 Prüfen &amp; Bestätigen</span>
</div>
<button class="px-4 py-1.5 border border-sage-100 dark:border-sage-800 rounded-xl text-xs font-bold text-sage-500 hover:bg-sage-50 transition-colors">
                Schließen
            </button>
</div>
<div class="p-6 pt-4 space-y-6">
<div class="bg-sage-50 dark:bg-sage-900/40 border border-sage-100 dark:border-sage-800/50 rounded-[2rem] p-6 space-y-6">
<div class="flex items-center gap-3">
<div class="size-9 rounded-full bg-sage-600 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-lg">fact_check</span>
</div>
<h3 class="text-sage-900 dark:text-sage-50 font-bold text-lg">Zusammenfassung</h3>
</div>
<div class="space-y-4 pl-1">
<div class="flex flex-col gap-1">
<span class="text-[10px] font-bold text-sage-400 dark:text-sage-500 tracking-widest uppercase">VON</span>
<span class="text-sage-900 dark:text-sage-100 font-semibold text-xl">Di., 27. Jan. 2026</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-[10px] font-bold text-sage-400 dark:text-sage-500 tracking-widest uppercase">BIS</span>
<span class="text-sage-900 dark:text-sage-100 font-semibold text-xl">Sa., 31. Jan. 2026</span>
</div>
</div>
<div class="pt-6 border-t border-sage-200/50 dark:border-sage-800/50">
<div class="inline-flex px-3 py-1 bg-sage-200 dark:bg-sage-700 rounded-full mb-5">
<span class="text-[10px] font-bold text-sage-700 dark:text-sage-200 tracking-wider uppercase">5 TAGE EINGEPLANT</span>
</div>
<div class="flex items-center justify-between p-3 bg-white/50 dark:bg-black/20 rounded-2xl border border-white dark:border-white/5">
<div class="flex flex-col">
<span class="text-sage-900 dark:text-sage-100 font-bold text-sm">Noch unsicher?</span>
<span class="text-[11px] text-sage-500">Zeitraum als vorläufig markieren</span>
</div>
<label class="relative flex h-[30px] w-[50px] cursor-pointer items-center rounded-full p-1 transition-colors">
<input class="invisible absolute peer" type="checkbox"/>
<div class="toggle-bg absolute inset-0 rounded-full bg-sage-200 dark:bg-sage-800 transition-colors"></div>
<div class="toggle-dot relative h-5.5 w-5.5 rounded-full bg-white shadow-md transition-transform duration-200 ease-in-out"></div>
</label>
</div>
</div>
</div>
<div class="flex justify-center pt-2">
<button class="w-full py-4 rounded-2xl bg-sage-600 text-white font-bold text-base hover:bg-sage-700 active:scale-[0.98] transition-all shadow-lg shadow-sage-600/20">
                    Bestätigen &amp; Speichern
                </button>
</div>
</div>
<div class="pb-6"></div>
</div>
</div>

</body></html>
