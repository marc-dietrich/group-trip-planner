global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - caddy:2019

  - job_name: backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
