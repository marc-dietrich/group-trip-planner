services:
  postgres:
    extends:
      file: ./database/docker-compose.yml
      service: postgres
    env_file:
      - database/.env
    ports: [] # keep internal; expose only via caddy

  backend:
    build:
      context: ./backend
    container_name: gtp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}
      - PORT=8000
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${CADDY_DOMAIN:-localhost}/api}
        VITE_OAUTH_BASE_URL: ${VITE_OAUTH_BASE_URL:-https://${CADDY_DOMAIN:-localhost}/oauth2}
        CUSTOM_DOMAIN: ${CUSTOM_DOMAIN:-true}
    container_name: gtp-frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  oauth-proxy:
    extends:
      file: ./oauth-proxy/docker-compose.yml
      service: oauth2-proxy
    env_file:
      - oauth-proxy/.env
    environment:
      - OAUTH_UPSTREAM=${OAUTH_UPSTREAM:-http://backend:8000}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-https://${CADDY_DOMAIN:-localhost}/oauth2/callback}
    ports: []

  caddy:
    image: caddy:2-alpine
    container_name: gtp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - oauth-proxy

volumes:
  db_data:
  caddy_data:
  caddy_config:
