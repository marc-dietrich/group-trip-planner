services:
  postgres:
    image: postgres:15-alpine
    container_name: gtp-postgres
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gtp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gtp_pw}
      - POSTGRES_DB=${POSTGRES_DB:-gtp}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gtp} -d ${POSTGRES_DB:-gtp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - com.centurylinklabs.watchtower.enable=true

  postgres-backup:
    build:
      context: ./database/backup
    container_name: gtp-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-gtp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gtp_pw}
      - POSTGRES_DB=${POSTGRES_DB:-gtp}
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE}
      - BACKUP_DAILY_CRON=${BACKUP_DAILY_CRON:-0 2 * * *}
      - BACKUP_WEEKLY_CRON=${BACKUP_WEEKLY_CRON:-0 3 * * 0}
      - BACKUP_MONTHLY_CRON=${BACKUP_MONTHLY_CRON:-0 4 1 * *}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-14}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-8}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-12}
      - BACKUP_RUN_ON_STARTUP=${BACKUP_RUN_ON_STARTUP:-false}
      - BACKUP_REMOTE_MODE=${BACKUP_REMOTE_MODE:-disabled}
      - BACKUP_REMOTE_TIMEOUT_SECONDS=${BACKUP_REMOTE_TIMEOUT_SECONDS:-120}
      - REMOTE_RSYNC_HOST=${REMOTE_RSYNC_HOST:-}
      - REMOTE_RSYNC_USER=${REMOTE_RSYNC_USER:-}
      - REMOTE_RSYNC_PATH=${REMOTE_RSYNC_PATH:-}
      - REMOTE_RSYNC_PORT=${REMOTE_RSYNC_PORT:-22}
      - REMOTE_SSH_KEY_PATH=${REMOTE_SSH_KEY_PATH:-/run/backup-ssh-key}
      - REMOTE_SSH_STRICT_HOST_KEY_CHECKING=${REMOTE_SSH_STRICT_HOST_KEY_CHECKING:-yes}
      - REMOTE_FTP_HOST=${REMOTE_FTP_HOST:-}
      - REMOTE_FTP_PORT=${REMOTE_FTP_PORT:-21}
      - REMOTE_FTP_USER=${REMOTE_FTP_USER:-}
      - REMOTE_FTP_PASSWORD=${REMOTE_FTP_PASSWORD:-}
      - REMOTE_FTP_PATH=${REMOTE_FTP_PATH:-/gtp-backups}
      - REMOTE_FTP_SSL=${REMOTE_FTP_SSL:-true}
      - REMOTE_FTP_VERIFY_CERT=${REMOTE_FTP_VERIFY_CERT:-true}
    volumes:
      - ./database/backups:/backups
      - ${REMOTE_SSH_KEY_MOUNT:-/dev/null}:/run/backup-ssh-key:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-marc-dietrich}/group-trip-planner-backend:${IMAGE_TAG:-latest}
    container_name: gtp-backend
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}
      - DATABASE_SSL_REQUIRE=${DATABASE_SSL_REQUIRE:-false}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - APP_NAME=${APP_NAME:-Gruppen-Urlaubsplaner API}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - FRONTEND_PATH_PREFIX=${FRONTEND_PATH_PREFIX:-}
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-false}
      - INVITE_TOKEN_TTL_DAYS=${INVITE_TOKEN_TTL_DAYS:-7}
      - VOICE_MOCK_ENABLED=${VOICE_MOCK_ENABLED:-true}
      - SUPPORTER_WEBHOOK_SECRET=${SUPPORTER_WEBHOOK_SECRET:-}
      - SUPPORTER_BADGE_DURATION_DAYS=${SUPPORTER_BADGE_DURATION_DAYS:-183}
      - STORAGE_ENABLED=${STORAGE_ENABLED:-true}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-http://garage:3900}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-garage}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-group-trip-images}
      - STORAGE_S3_USE_SSL=${STORAGE_S3_USE_SSL:-false}
      - IMAGE_UPLOAD_MAX_INPUT_BYTES=${IMAGE_UPLOAD_MAX_INPUT_BYTES:-5242880}
      - PROFILE_IMAGE_TARGET_BYTES=${PROFILE_IMAGE_TARGET_BYTES:-102400}
      - GROUP_IMAGE_TARGET_BYTES=${GROUP_IMAGE_TARGET_BYTES:-204800}
      - PROFILE_IMAGE_WIDTH=${PROFILE_IMAGE_WIDTH:-512}
      - PROFILE_IMAGE_HEIGHT=${PROFILE_IMAGE_HEIGHT:-512}
      - GROUP_IMAGE_WIDTH=${GROUP_IMAGE_WIDTH:-1024}
      - GROUP_IMAGE_HEIGHT=${GROUP_IMAGE_HEIGHT:-512}
      - PRESIGNED_URL_TTL_SECONDS=${PRESIGNED_URL_TTL_SECONDS:-300}
    expose:
      - "8000"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  stripe-service:
    build:
      context: ./apps/stripe-service
    container_name: gtp-stripe-service
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PORT=3000
      - ALLOWED_ORIGIN=${STRIPE_ALLOWED_ORIGIN:-http://localhost:5173}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CHECKOUT_SUCCESS_URL=${CHECKOUT_SUCCESS_URL}
      - CHECKOUT_CANCEL_URL=${CHECKOUT_CANCEL_URL}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - SUPPORTER_API_BASE_URL=${SUPPORTER_API_BASE_URL:-http://backend:8000}
      - SUPPORTER_WEBHOOK_SECRET=${SUPPORTER_WEBHOOK_SECRET:-}
    expose:
      - "3000"

  contact-service:
    build:
      context: ./apps/contact-service
    container_name: gtp-contact-service
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PORT=3002
      - ALLOWED_ORIGIN=${CONTACT_ALLOWED_ORIGIN:-http://localhost:5173}
      - CONTACT_SUPPORT_EMAIL=${CONTACT_SUPPORT_EMAIL:-kontakt@group-trip-planner.local}
      - CONTACT_LOG_FILE=${CONTACT_LOG_FILE}
      - CONTACT_LOG_MAX_BYTES=${CONTACT_LOG_MAX_BYTES:-10485760}
    expose:
      - "3002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-marc-dietrich}/group-trip-planner-frontend:${IMAGE_TAG:-latest}
    container_name: gtp-frontend
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gtp-node-exporter
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    expose:
      - "9100"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: gtp-postgres-exporter
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}?sslmode=disable
    expose:
      - "9187"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gtp-prometheus
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      - backend
      - node-exporter
      - postgres-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: gtp-grafana
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  oauth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: gtp-oauth-proxy
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    depends_on:
      - backend
    command:
      - "--http-address=0.0.0.0:4180"
      - "--provider=google"
      - "--email-domain=*"
      - "--client-id=${OAUTH_CLIENT_ID}"
      - "--client-secret=${OAUTH_CLIENT_SECRET}"
      - "--cookie-secret=${OAUTH_COOKIE_SECRET}"
      - "--cookie-secure=true"
      - "--upstream=http://backend:8000"
      - "--redirect-url=https://${CADDY_DOMAIN:-localhost}/oauth2/callback"
      - "--skip-provider-button=true"
      - "--set-authorization-header=true"
      - "--pass-authorization-header=true"
      - "--pass-access-token=true"
    expose:
      - "4180"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: caddy:2.8.4-alpine
    container_name: gtp-caddy
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - oauth-proxy
      - grafana
      - prometheus
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
      - MONITORING_USER=${MONITORING_USER:-monitor}
      - MONITORING_PASSWORD_HASH=${MONITORING_PASSWORD_HASH}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: gtp-watchtower
    restart: unless-stopped
    pull_policy: ${COMPOSE_PULL_POLICY:-always}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
    command: --interval 300 --rolling-restart --cleanup --label-enable

volumes:
  db_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
