version: "3.9"

services:
  postgres:
    image: ghcr.io/marc-dietrich/postgres:latest
    container_name: gtp-postgres
    restart: unless-stopped
    env_file:
      - database/.env
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/marc-dietrich/backend:latest
    container_name: gtp-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}
      - PORT=8000
    expose:
      - "8000"

  frontend:
    image: ghcr.io/marc-dietrich/frontend:latest
    container_name: gtp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  node-exporter:
    image: ghcr.io/marc-dietrich/node-exporter:latest
    container_name: gtp-node-exporter
    restart: unless-stopped
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  postgres-exporter:
    image: ghcr.io/marc-dietrich/postgres-exporter:latest
    container_name: gtp-postgres-exporter
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "9187"

  prometheus:
    image: ghcr.io/marc-dietrich/prometheus:latest
    container_name: gtp-prometheus
    restart: unless-stopped
    depends_on:
      - backend
      - node-exporter
      - postgres-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: ghcr.io/marc-dietrich/grafana:latest
    container_name: gtp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"

  oauth-proxy:
    image: ghcr.io/marc-dietrich/oauth-proxy:latest
    container_name: gtp-oauth-proxy
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - oauth-proxy/.env
    environment:
      - OAUTH2_PROXY_UPSTREAMS=http://backend:8000
      - OAUTH2_PROXY_REDIRECT_URL=https://${CADDY_DOMAIN:-localhost}/oauth2/callback
    expose:
      - "4180"

  caddy:
    image: ghcr.io/marc-dietrich/caddy:latest
    container_name: gtp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - oauth-proxy
      - grafana
      - prometheus
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
      - MONITORING_USER=${MONITORING_USER:-monitor}
      - MONITORING_PASSWORD_HASH=${MONITORING_PASSWORD_HASH}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gtp-cloudflared
    restart: unless-stopped
    depends_on:
      - caddy
    user: root
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - /home/marc/.cloudflared:/etc/cloudflared:ro

  watchtower:
    image: containrrr/watchtower
    container_name: gtp-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - DOCKER_API_VERSION=1.53
    command: --interval 300 --rolling-restart

volumes:
  db_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

