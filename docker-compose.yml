services:
  postgres:
    extends:
      file: ./database/docker-compose.yml
      service: postgres
    env_file:
      - database/.env
    ports: [] # keep internal; expose only via caddy

  backend:
    build:
      context: ./backend
    container_name: gtp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}
      - PORT=8000
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${CADDY_DOMAIN:-localhost}/api}
        VITE_OAUTH_BASE_URL: ${VITE_OAUTH_BASE_URL:-https://${CADDY_DOMAIN:-localhost}/oauth2}
        CUSTOM_DOMAIN: ${CUSTOM_DOMAIN:-true}
    container_name: gtp-frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: gtp-node-exporter
    restart: unless-stopped
    expose:
      - "9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: gtp-postgres-exporter
    restart: unless-stopped
    expose:
      - "9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: gtp-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      - backend
      - node-exporter
      - postgres-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: gtp-grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-observer}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-local-metrics-please}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://${CADDY_DOMAIN:-localhost}/ops/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  oauth-proxy:
    extends:
      file: ./oauth-proxy/docker-compose.yml
      service: oauth2-proxy
    env_file:
      - oauth-proxy/.env
    environment:
      - OAUTH_UPSTREAM=${OAUTH_UPSTREAM:-http://backend:8000}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-https://${CADDY_DOMAIN:-localhost}/oauth2/callback}
    ports: []

  caddy:
    image: caddy:2-alpine
    container_name: gtp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "2019"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
      - MONITORING_USER=${MONITORING_USER:-monitor}
      - MONITORING_PASSWORD_HASH=${MONITORING_PASSWORD_HASH:-$$2a$$14$$oPfUKnGPvrpCYaP/iO6pCeZPpHzdajL99JVJT7lboAsWbb7ULdySi}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - oauth-proxy
      - grafana
      - prometheus

volumes:
  db_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
