services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: gtp-caddy
    restart: unless-stopped
    environment:
      - CADDY_EMAIL=${CADDY_EMAIL:-dev@example.com}
      - MONITORING_USER=${MONITORING_USER:-monitor}
      - MONITORING_PASSWORD_HASH=${MONITORING_PASSWORD_HASH:-$$2a$$14$$eImiTXuWVxfM37uY4JANjQ==}
    ports:
      - "${CADDY_HTTP_HOST_PORT:-80}:80"
      - "${CADDY_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./services/caddy-service/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - oauth-proxy

volumes:
  caddy_data:
  caddy_config:
