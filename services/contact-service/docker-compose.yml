services:
  contact-service:
    build:
      context: ./services/contact-service
    container_name: gtp-contact-service
    restart: unless-stopped
    environment:
      - PORT=3002
      - ALLOWED_ORIGIN=${CONTACT_ALLOWED_ORIGIN:-http://localhost:3000}
      - CONTACT_SUPPORT_EMAIL=${CONTACT_SUPPORT_EMAIL:-kontakt@group-trip-planner.local}
      - CONTACT_LOG_FILE=${CONTACT_LOG_FILE}
      - CONTACT_LOG_MAX_BYTES=${CONTACT_LOG_MAX_BYTES:-10485760}
    ports:
      - "${CONTACT_HOST_PORT:-3002}:3002"
    expose:
      - "3002"
