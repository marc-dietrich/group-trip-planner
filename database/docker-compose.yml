services:
  postgres:
    image: postgres:15-alpine
    container_name: gtp-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gtp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gtp_pw}
      - POSTGRES_DB=${POSTGRES_DB:-gtp}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Apply SQL migrations automatically on first init
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gtp} -d ${POSTGRES_DB:-gtp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
