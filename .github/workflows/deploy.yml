name: Deploy (Containers)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${GITHUB_REPOSITORY_OWNER,,}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/group-trip-planner-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/group-trip-planner-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || '/' }}
            VITE_OAUTH_BASE_URL=${{ secrets.VITE_OAUTH_BASE_URL || '/' }}
            CUSTOM_DOMAIN=true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache,mode=max

      - name: Render deployment compose file
        run: |
          cat > deploy-compose.yml <<'EOF'
          version: "3.9"
          services:
            postgres:
              image: postgres:15-alpine
              environment:
                POSTGRES_USER: ${POSTGRES_USER:-gtp}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtp_pw}
                POSTGRES_DB: ${POSTGRES_DB:-gtp}
              volumes:
                - db_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtp} -d ${POSTGRES_DB:-gtp}"]
                interval: 10s
                timeout: 5s
                retries: 5

            backend:
              image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
              environment:
                PORT: 8000
                DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gtp}:${POSTGRES_PASSWORD:-gtp_pw}@postgres:5432/${POSTGRES_DB:-gtp}
              depends_on:
                postgres:
                  condition: service_healthy
              ports:
                - "8000:8000"

            frontend:
              image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
              depends_on:
                - backend
              ports:
                - "8080:80"

            oauth-proxy:
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
              environment:
                OAUTH_UPSTREAM: http://backend:8000
                OAUTH_REDIRECT_URL: http://localhost:4180/oauth2/callback
                OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
                OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
                OAUTH_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
              ports:
                - "4180:4180"
              depends_on:
                - backend

          volumes:
            db_data:
          EOF

      - name: Upload deployment compose
        uses: actions/upload-artifact@v4
        with:
          name: deploy-compose
          path: deploy-compose.yml
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Backend image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Compose artifact: deploy-compose.yml" >> $GITHUB_STEP_SUMMARY
